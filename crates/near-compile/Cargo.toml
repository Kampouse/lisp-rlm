[package]
name = "near-compile"
version = "0.1.3"
edition = "2021"
description = "Lisp/TS/Solidity → NEAR contract compiler CLI — init, compile, bench, view/call against any network"
license = "MIT"
repository = "https://github.com/Kampouse/lisp-rlm"
readme = "README.md"
keywords = ["near", "blockchain", "lisp", "wasm", "compiler"]
categories = ["development-tools::build-utils"]

[[bin]]
name = "near-compile"
path = "src/main.rs"

[dependencies]
# dual spec: path for workspace builds, version for the published crate
# (cargo publish rewrites to the registry dep — publish the lib first)
lisp-rlm-wasm = { path = "../..", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
# secondary sanity check: validate emitted components with wasmtime after our
# own encoder pass (catches codegen bugs the encoder misses)
wasmtime = { version = "45", features = ["cranelift", "component-model"] }
wasmparser = { version = "0.228.0", features = ["simd"] }
bs58 = "0.5"
shellexpand = "3"
wasmprinter = "0.248.0"
