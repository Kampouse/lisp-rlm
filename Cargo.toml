[workspace]
members = [".", "clojure-rlm", "crates/browser-compiler"]
# schnorr-wasm is a #![no_std] wasm-only crate (panic=abort only via own-root
# profile); host workspace builds fail without -Zbuild-std. The stitcher uses
# the standalone k256-schnorr-wasm/ project instead. Excluded like http-adapter.
exclude = ["http-adapter", "wasm-test", "schnorr-wasm"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true

[package]
name = "lisp-rlm-wasm"
version = "0.1.0"
edition = "2021"
description = "Lisp runtime compiled to WASM"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_allocator = "0.147.0"
oxc_parser = "0.147.0"
oxc_syntax = "0.147.0"
oxc_span = "0.147.0"
oxc_ast = "0.147.0"
wit-component = "0.248.0"
wit-parser = "0.248.0"
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
im = "15"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
wat = "1.0"
wasm-encoder = "0.248.0"
wasmparser = { version = "0.228.0", features = ["simd"] }
wasmprinter = "0.248.0"
finite-wasm = "0.6"
bincode = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
hmac = "0.12"
rand = "0.8"
rand_chacha = "0.3"
solang-parser = "0.3.5"
leb128 = "0.2.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "45", features = ["cranelift"] }
wasmtime-wasi = { version = "45" }
wasmtime-wasi-http = { version = "45" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
rustyline = "14"
libc = "0.2"

[patch.crates-io]
near-vm-runner = { path = "vendor/near-vm-runner" }

[dev-dependencies]
tempfile = "3.27.0"
rayon = "1.10"
wat = "1.0"
proptest = "1.6"
near-vm-runner = "=0.37.3"
near-parameters = "=0.37.3"
near-primitives-core = "=0.37.3"

[[bin]]
name = "outlayer-run"
path = "src/bin/outlayer_run.rs"

[[bin]]
name = "lisp-run"
path = "src/bin/lisp_run.rs"

[[bin]]
name = "near-compile"
path = "src/bin/near_compile.rs"

[[bin]]
name = "dump-wasm"
path = "src/bin/dump_wasm.rs"

[[bin]]
name = "emit-wasm"
path = "src/bin/emit_wasm.rs"

[[bin]]
name = "near-mock"
path = "src/bin/near_mock.rs"

[[bin]]
name = "compile"
path = "src/bin/compile.rs"

[[bin]]
name = "sol-compile"
path = "src/bin/sol_compile.rs"

[[bin]]
name = "ir-dump"
path = "src/bin/ir_dump.rs"

[[bin]]
name = "wrun"
path = "src/bin/wrun.rs"

[[bin]]
name = "lisp-rlm"
path = "src/bin/lisp_rl.rs"
