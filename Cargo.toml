[workspace]
members = [".", "clojure-rlm", "crates/browser-compiler", "crates/near-compile"]
# schnorr-wasm is a #![no_std] wasm-only crate (panic=abort only via own-root
# profile); host workspace builds fail without -Zbuild-std. The stitcher uses
# the standalone k256-schnorr-wasm/ project instead. Excluded like http-adapter.
# schnorr-wasm was removed 2026-09-08: the crypto stitched into contracts
# comes from schnorr/ via the committed src/wasm_emit/schnorr.wasm artifact
# (regenerate with `make schnorr-wasm`). The old crate was consumed only by
# the deleted build.rs (its SCHNORR_WASM_PATH output was read by nothing).
exclude = ["http-adapter", "wasm-test", "schnorr"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true

[package]
name = "lisp-rlm-wasm"
version = "0.1.4"
edition = "2021"
description = "Lisp/TS/Solidity → NEAR smart-contract compiler core (parser, typechecker, wasm emitter, crypto stitcher, wit bindings)"
license = "MIT"
repository = "https://github.com/Kampouse/lisp-rlm"
readme = "README.md"
keywords = ["lisp", "near", "blockchain", "wasm", "compiler"]
categories = ["compilers"]
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_allocator = "0.147.0"
oxc_parser = "0.147.0"
oxc_syntax = "0.147.0"
oxc_span = "0.147.0"
oxc_ast = "0.147.0"
wit-component = "0.248.0"
wit-parser = "0.248.0"
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
im = "15"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
# Real Keccak-512 for the near-mock keccak512 host (sha3 has no Keccak-512;
# SHAKE128 stand-in replaced 2026-09-08 — nearcore uses real Keccak-512).
tiny-keccak = { version = "2", features = ["keccak"] }
# Real alt_bn128 (BN254) math for the near-mock precompile hosts — same
# crate near-vm-runner uses (vendor/near-vm-runner/src/logic/alt_bn128.rs).
# Real alt_bn128 (BN254) math for the near-mock precompile hosts — the exact
# crate near-vm-runner uses (vendor pins zeropool-bn 0.5.11 as "bn"), so
# multiexp/sum/pairing results are byte-identical to production.
bn = { package = "zeropool-bn", version = "0.5.11", default-features = false }
# Real secp256k1 ecrecover + NIST P-256 verify for the near-mock crypto hosts
# (near-faithful: 65B recovered point, prehash verify, malformed input → 0).
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
wat = "1.0"
wasm-encoder = "0.248.0"
wasmparser = { version = "0.248", features = ["simd"] }
wasmprinter = "0.248.0"
finite-wasm = "0.6"
bincode = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
hmac = "0.12"
rand = "0.8"
rand_chacha = "0.3"
solang-parser = "0.3.5"
leb128 = "0.2.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "45", features = ["cranelift"] }
wasmtime-wasi = { version = "45" }
wasmtime-wasi-http = { version = "45" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
rustyline = "14"
libc = "0.2"
# Byte-faithful BLS12-381 host validation for the mock (port of nearcore's
# bls12381.rs). Native targets only — never linked into the wasm32 output.
blst = { version = "0.3.17", features = ["portable"] }

[patch.crates-io]
near-vm-runner = { path = "vendor/near-vm-runner" }

[dev-dependencies]
tempfile = "3.27.0"
rayon = "1.10"
wat = "1.0"
proptest = "1.6"
near-vm-runner = "=0.37.3"
near-parameters = "=0.37.3"
near-primitives-core = "=0.37.3"

[[bin]]
name = "outlayer-run"
path = "src/bin/outlayer_run.rs"

[[bin]]
name = "lisp-run"
path = "src/bin/lisp_run.rs"

[[bin]]
name = "dump-wasm"
path = "src/bin/dump_wasm.rs"

[[bin]]
name = "emit-wasm"
path = "src/bin/emit_wasm.rs"

[[bin]]
name = "near-mock"
path = "src/bin/near_mock/mod.rs"

[[bin]]
name = "compile"
path = "src/bin/compile.rs"

[[bin]]
name = "sol-compile"
path = "src/bin/sol_compile.rs"

[[bin]]
name = "ir-dump"
path = "src/bin/ir_dump.rs"

[[bin]]
name = "wrun"
path = "src/bin/wrun.rs"

[[bin]]
name = "lisp-rlm"
path = "src/bin/lisp_rl.rs"
