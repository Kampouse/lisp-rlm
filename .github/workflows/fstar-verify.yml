name: F* Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install opam
        run: brew install opam
      
      - name: Initialize opam
        run: opam init --disable-sandboxing -y
      
      - name: Install F*
        run: opam install fstar -y
      
      - name: Install Z3 4.13.3 (F* solver)
        run: |
          curl -sfL https://github.com/Z3Prover/z3/releases/download/z3-4.13.3/z3-4.13.3-arm64-osx-13.7.zip -o /tmp/z3.zip
          mkdir -p "$HOME/.local/bin"
          unzip -oqj /tmp/z3.zip '*/bin/z3' -d "$HOME/.local/bin"
          mv "$HOME/.local/bin/z3" "$HOME/.local/bin/z3-4.13.3"
          chmod +x "$HOME/.local/bin/z3-4.13.3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      
      - name: Verify proofs
        run: |
          eval $(opam env)
          cd verification/sim
          fstar.exe CoreTypes.fst ValueCorrespondence.fst Simulation.fst HttpStateMachine.fst Integration.fst RuntimeAssertions.fst
      
      - name: Check invariants match Rust
        run: |
          # Verify tag constants match between F* and Rust
          grep "TAG_NUM.*=.*0" src/tagged_value.rs
          grep "tag_num.*=.*0" verification/sim/CoreTypes.fst